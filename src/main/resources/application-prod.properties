spring.datasource.url=jdbc:mysql://mysql:3306/db_brink_calcados?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=never
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# JWT - IMPORTANTE: mínimo 32 caracteres!
jwt.secret=${JWT_SECRET:sua-chave-super-segura-com-mais-de-32-caracteres-para-producao-2026}
jwt.validity=3600000

spring.cache.type=redis
spring.cache.redis.time-to-live=PT5M
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=app::
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=minha_senha_segura

logging.level.org.springframework.cache.interceptor.CacheInterceptor=TRACE

api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}
ms.report.url=${MS_REPORT_URL:http://localhost:8081}
#api.gateway.url=http://localhost:8080