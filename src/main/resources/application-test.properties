
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true


spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=WARN
logging.level.school.sptech.crud_proj_v1=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN


server.port=8080
server.servlet.context-path=/

server.connection-timeout=30000
server.tomcat.connection-timeout=30000

api.gateway.url=aaaaaaaaaaaaaaaaaaaaaaaaaaa
ms.report.url=aaaaaaaaaaaaaaaaaaaaaaaaaaaaa
gemini.api.key=aaaaaaaaaaaaaaaaaaaaaa
gemini.api.url=aaaaaaaaaaaaaaaaaaaaaaaaa