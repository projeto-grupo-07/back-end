# ========================================================================
# APPLICATION-TEST.PROPERTIES - Configuração para testes com H2
# ========================================================================

# Perfil ativo
spring.profiles.active=test

# ========================================================================
# DATASOURCE H2 (Em Memória)
# ========================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================================================
# JPA / HIBERNATE
# ========================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# ========================================================================
# SQL Initialization (Data.sql)
# ========================================================================
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ========================================================================
# H2 Console (opcional, para debug)
# ========================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================================================
# Logging
# ========================================================================
logging.level.root=WARN
logging.level.school.sptech.crud_proj_v1=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ========================================================================
# Server
# ========================================================================
server.port=8080
server.servlet.context-path=/

# ========================================================================
# Timeouts para JMeter
# ========================================================================
server.connection-timeout=30000
server.tomcat.connection-timeout=30000