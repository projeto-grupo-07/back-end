name: Build and Artifacts

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Compilar o código e gerar o .jar
  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e empacotar com Maven
        # O comando clean package gera o .jar na pasta target/
        run: mvn -B clean package -DskipTests

      # Esta é a etapa mágica: ela pega o .jar e salva no GitHub
      - name: Salvar Artefato (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: app-backend-jar
          path: target/*.jar
          # Define quanto tempo o GitHub vai guardar esse arquivo nos servidores deles
          retention-days: 7

  # JOB 2: Pegar o .jar, empacotar no Docker e enviar pro Hub
  build-docker:
    # Este job SÓ roda se o build-java terminar com sucesso
    needs: build-java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Baixa o .jar que foi salvo no job anterior e coloca na pasta target/
      - name: Baixar Artefato (.jar)
        uses: actions/download-artifact@v4
        with:
          name: app-backend-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: viniciusoliveira201002/backend:latest