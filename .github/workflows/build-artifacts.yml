name: Docker Back-end Update & JMeter Test

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Constrói a imagem temporária e carrega no runner (NÃO faz o push)
      - name: Build Docker image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: brinks-backend-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Sobe o container local de teste usando o perfil 'test'
      - name: Start Backend Container
        run: |
          docker run -d -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=test \
            --name backend-app \
            brinks-backend-test:latest

      # 3. Aguarda o endpoint customizado /health responder "OK"
      - name: Wait for Backend to be ready
        run: |
          echo "Aguardando o Spring Boot iniciar..."
          for i in {1..30}; do
            # O '|| true' impede que o mecanismo do GitHub Actions aborte o script quando o curl falhar por falta de conexão inicial
            RESPONSE=$(curl -s http://localhost:8080/health || true)
            
            if [ "$RESPONSE" == "OK" ]; then
              echo "API pronta e respondendo!"
              exit 0
            fi
            
            echo "Tentativa $i: A aplicação ainda está subindo..."
            sleep 5
          done
          echo "Timeout: A API não subiu dentro do tempo esperado."
          docker logs backend-app
          exit 1

      # 4. Prepara o ambiente para o JMeter
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Apache JMeter
        run: |
          JMETER_VERSION="5.6.3"
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
          mv apache-jmeter-${JMETER_VERSION} /opt/jmeter

      # 5. Executa o teste contra a aplicação rodando no runner
      - name: Run JMeter Test
        run: |
          /opt/jmeter/bin/jmeter -n -t ./jmeter/teste.jmx -l results.jtl -e -o jmeter-report/

      # 6. Salva o relatório do JMeter como artefato no GitHub
      - name: Upload JMeter Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: jmeter-report/

      # 7. Se o teste passar, constrói e faz o push oficial para o Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            guilhermefigueiredodocker/brinks-backend-prod:latest
            guilhermefigueiredodocker/brinks-backend-prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
